pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        // Loom >= 1.14: "net.fabricmc.fabric-loom-remap" = obfuscated MC (<= 1.21.11); needs Gradle >= 9.8 on JDK 25.
        id 'net.fabricmc.fabric-loom-remap' version '1.19.4'
        id 'net.neoforged.moddev' version '2.0.148'
    }
}

rootProject.name = 'ccluajit'
include 'common', 'fabric', 'neoforge'
