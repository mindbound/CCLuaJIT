// Loader-independent code. CCLuaJIT only talks to CC:T core (no Minecraft classes), so this is a plain Java
// library: no MDG, no Minecraft jar, no mappings.

// ---- Native library (libcclj) -----------------------------------------------------------------------------------
// natives/build-natives.sh <platform-id> writes natives/build/out/natives/<platform-id>/<lib>. That directory is a
// resource root of this module, so whatever has been built becomes the resource natives/<platform-id>/<lib>, which
// NativeLoader (in this module) reads. It is here and not in :neoforge because:
//   - :neoforge (and a later :fabric) copies this module's resources into the mod jar, so the natives need no
//     per-loader setup;
//   - the test runtime classpath of this module (nativeProbe, and later headlessSuite -Pfactory=luajit) gets them
//     from the same place.
// A missing or empty directory is not an error: the jar then has no natives, and every computer runs on Cobalt.
def nativesOut = rootProject.file('natives/build/out')
sourceSets.main.resources.srcDir(nativesOut)
// Binaries do not belong in the sources jar (:neoforge's sourcesJar excludes them too).
tasks.named('sourcesJar', Jar) { exclude('natives/**') }

dependencies {
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cct_version}"
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-core:${cct_version}"
    // ServerContext (the one static field we set) is in CC:T "common". It is Mojang-named, but we never touch a
    // Minecraft type, so javac does not need Minecraft on the classpath.
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-common:${cct_version}"
    // Provided by Minecraft at runtime (MC 1.21.1 ships slf4j 2.0.9).
    compileOnly "org.slf4j:slf4j-api:2.0.9"

    // Headless CC:T runner (WP 0): the real CC:T core (Computer, ComputerThread, MainThread, bios + ROM) without
    // Minecraft. The core's runtime variant brings Cobalt, Guava, fastutil, Netty, jzlib and slf4j-api.
    testImplementation "cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cct_version}"
    testImplementation "cc.tweaked:cc-tweaked-${minecraft_version}-core:${cct_version}"
    // Same version as slf4j-api above, so the binding does not upgrade the API on the test classpath.
    testRuntimeOnly "org.slf4j:slf4j-simple:2.0.9"
}

// ---- Headless CC:T runner and conformance suite (PLAN.md WP 0) --------------------------------------------------
// The runners in src/test/java/io/github/mindbound/cclj/headless are plain main programs, not JUnit tests. They boot
// a real CC:T computer from the test runtime classpath and read bios.lua and the ROM out of the CC:T core jar, which
// is picked off that classpath by file name. Each task fails the build when its runner exits non-zero, or when the
// JNI scan (jniScan, below) finds a line of -Xcheck:jni output.
//
//   ./gradlew :common:headlessSmoke    smoke.lua; every check in it is an assert, so any wrong result fails
//   ./gradlew :common:headlessSuite    CC:T's test-rom; report in build/headless/suite.tsv
//   ./gradlew :common:fairnessProbe    time-slicing measurement; informational (fails only on a JNI scan hit or a
//                                      non-zero exit of the JVM)
//
// Project properties:
//   -Pfactory=cobalt|luajit|<class>   machine factory for headlessSmoke and headlessSuite (default cobalt). 'luajit'
//                                     is io.github.mindbound.cclj.computer.LuaJITMachine; any other class needs a
//                                     public (MachineEnvironment, InputStream) constructor.
//   -Phttp                            headlessSuite: enable CC:T's HTTP API (NettyHttp, needs network). Default: off.
//   -PexpectedFailures=<file>|none    headlessSuite: override the expected-failures file (path relative to the
//                                     repository root). By default the task uses
//                                     src/test/resources/headless/expected-failures-<factory>[-http].txt if it
//                                     exists (<factory> = the -Pfactory value, or a class's simple name), and
//                                     expects no failures if it does not.
//   -PsuiteTimeout=<seconds>          headlessSuite: overall timeout (default 300).
//   -PbootTimeout=<seconds>           headlessSmoke and headlessSuite: give up when the computer has not turned on
//                                     after this long (default 15), i.e. the machine failed at boot.
//   -Pnopause, -Pthreads=N            fairnessProbe: never return PAUSE; number of computer worker threads.
//
// headlessSuite passes when the suite finishes, every fail/error is listed in the expected-failures file, and every
// listed test does fail or error (CctSuiteRunner's verdict lines say which rule was broken).
// src/test has no JUnit tests yet (only these main programs). Gradle 9 fails `test` when test sources exist but it
// discovers no tests, which would break `build`.
tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
}

def cctCoreJarName = "cc-tweaked-${minecraft_version}-core-${cct_version}.jar"
def cctCoreJar = configurations.testRuntimeClasspath.filter { it.name == cctCoreJarName }
def headlessDir = layout.buildDirectory.dir('headless')

def factoryArg = providers.gradleProperty('factory').getOrElse('cobalt')
def factoryClass = factoryArg == 'luajit' ? 'io.github.mindbound.cclj.computer.LuaJITMachine' : factoryArg
// Expected-failures files are keyed by a short name: 'luajit' for our machine however it is named, otherwise the
// -Pfactory value or a class's simple name.
def factoryKey = factoryClass == 'io.github.mindbound.cclj.computer.LuaJITMachine' ? 'luajit'
    : factoryArg.contains('.') ? factoryArg.substring(factoryArg.lastIndexOf('.') + 1) : factoryArg
def httpProp = providers.gradleProperty('http').getOrNull()
def httpEnabled = httpProp != null && httpProp != 'false'

// ---- JNI scan (docs/port-1.21.1/M1.md section 3.14, fact F13) ---------------------------------------------------
// -Xcheck:jni reports a misuse of JNI by printing a line, and the JVM then goes on with exit code 0 (only a FATAL
// ERROR ends it). So every JavaExec task here runs through jniScan: its stdout and stderr also go, whole lines at a
// time, to build/headless/logs/<task>.log; after the run, the task fails if that log holds a line with one of the
// patterns in natives/tests/jni-warnings.txt (the file natives/tests/jni-scan.sh reads), or if the JVM exited
// non-zero. The WARNING and FATAL ERROR lines go to stdout and the MXCSR warning to stderr, so both are scanned.
def jniPatterns = rootProject.file('natives/tests/jni-warnings.txt')

/** Copies each complete line written to it into a shared file, and passes every byte on to {@code out}. */
class LineTee extends OutputStream {
    private final OutputStream out
    // Shared by the stdout and stderr tees of a task: lines are written under its lock.
    private final OutputStream file
    private final ByteArrayOutputStream line = new ByteArrayOutputStream()

    LineTee(OutputStream out, OutputStream file) {
        this.out = out
        this.file = file
    }

    @Override
    void write(int b) {
        out.write(b)
        line.write(b)
        if (b == 10) endLine()
    }

    @Override
    void write(byte[] b, int off, int len) {
        out.write(b, off, len)
        int start = off
        for (int i = off; i < off + len; i++) {
            if (b[i] == (byte) 10) {
                line.write(b, start, i + 1 - start)
                endLine()
                start = i + 1
            }
        }
        line.write(b, start, off + len - start)
    }

    @Override
    void flush() {
        out.flush()
    }

    /**
     * Writes what is left of an unfinished last line (once the process has ended), ended with a newline in the file
     * only, so that the other stream's unfinished last line cannot join it.
     */
    void finish() {
        if (line.size() > 0) {
            line.write(10)
            endLine()
        }
    }

    private void endLine() {
        synchronized (file) {
            line.writeTo(file)
        }
        line.reset()
    }
}

def jniScan = { JavaExec task ->
    def log = headlessDir.get().file("logs/${task.name}.log").asFile
    task.inputs.file(jniPatterns)
    // The exit code is checked in doLast, after the scan, so that both are reported.
    task.ignoreExitValue = true
    OutputStream logOut = null
    LineTee outTee = null, errTee = null
    task.doFirst {
        log.parentFile.mkdirs()
        // Unbuffered: LineTee writes whole lines, so the log is complete even when doLast does not run (the JVM
        // could not start, or the task timed out). On Windows, an NIO stream also lets the file be deleted while a
        // stream that was never closed is still open.
        logOut = java.nio.file.Files.newOutputStream(log.toPath())
        // Unset streams are null here (Gradle then forwards to its log); System.out and System.err inside the
        // build go to the same place. A tee that throws stops Gradle reading that stream, which blocks the JVM.
        outTee = new LineTee(task.standardOutput ?: System.out, logOut)
        errTee = new LineTee(task.errorOutput ?: System.err, logOut)
        task.standardOutput = outTee
        task.errorOutput = errTee
    }
    task.doLast {
        outTee.finish()
        errTee.finish()
        logOut.close()
        def patterns = jniPatterns.readLines('UTF-8')
            .collect { it.endsWith('\r') ? it.substring(0, it.length() - 1) : it }
            .findAll { !it.isEmpty() }
        long hits = 0
        def shown = []
        log.withReader('ISO-8859-1') { reader ->
            reader.eachLine { line ->
                if (patterns.any { line.contains(it) }) {
                    hits++
                    if (shown.size() < 100) shown << line
                }
            }
        }
        int exit = task.executionResult.get().exitValue
        def problems = []
        if (hits > 0) {
            task.logger.error("${task.name}: ${hits} line(s) of -Xcheck:jni output in ${log}" +
                (hits > shown.size() ? "; the first ${shown.size()}:" : ':'))
            shown.each { task.logger.error("  ${it}") }
            problems << "${hits} line(s) of -Xcheck:jni output"
        }
        if (exit != 0) problems << "exit code ${exit}"
        if (!problems.isEmpty()) throw new GradleException("${task.name} failed: ${problems.join(', ')} (log: ${log})")
        task.logger.lifecycle("${task.name}: JNI scan clean, exit code 0 (log: ${log})")
    }
}

def configureHeadless = { JavaExec task ->
    task.group = 'verification'
    task.classpath = sourceSets.test.runtimeClasspath
    task.jvmArgs('-Xcheck:jni')
    task.inputs.files(cctCoreJar)
    // The runners create their computers' root mounts with Files.createTempDirectory. Keep them under build/, one
    // folder per task, emptied before each run.
    def tmp = headlessDir.get().dir("tmp/${task.name}").asFile
    task.systemProperty('java.io.tmpdir', tmp.absolutePath)
    task.systemProperty('cct.version', cct_version)
    task.systemProperty('headless.bootTimeout', providers.gradleProperty('bootTimeout').getOrElse('15'))
    // LuaJITMachine's natives are extracted here (NativeLibrary.ensureLoaded), emptied before each run.
    def natives = headlessDir.get().dir("natives/${task.name}").asFile
    task.systemProperty('ccluajit.nativeDir', natives.absolutePath)
    // Run in build/headless/work/<task>, so a JVM crash log (hs_err_pid*.log, replay_pid*.log) lands under build/.
    def work = headlessDir.get().dir("work/${task.name}").asFile
    task.workingDir = work
    task.doFirst {
        tmp.deleteDir()
        tmp.mkdirs()
        natives.deleteDir()
        work.mkdirs()
        def meta = it.javaLauncher.get().metadata
        it.logger.lifecycle("${it.name}: Java ${meta.javaRuntimeVersion} at ${meta.installationPath}")
    }
    jniScan(task)
}

tasks.register('headlessSmoke', JavaExec) {
    configureHeadless(it)
    description = 'Boots a headless CC:T computer and runs src/test/resources/headless/smoke.lua (-Pfactory).'
    mainClass = 'io.github.mindbound.cclj.headless.HeadlessRunner'
    def smoke = file('src/test/resources/headless/smoke.lua')
    inputs.file(smoke)
    // smoke.lua calls read(); --type queues "Steve" + Enter as char/key events.
    argumentProviders.add({
        ['--core-jar', cctCoreJar.singleFile.absolutePath, '--factory', factoryClass,
         '--startup', smoke.absolutePath, '--type', 'Steve']
    } as CommandLineArgumentProvider)
}

tasks.register('headlessSuite', JavaExec) {
    configureHeadless(it)
    description = 'Runs CC:T\'s Lua test suite (src/test/resources/test-rom) on a headless CC:T computer ' +
        '(-Pfactory, -Phttp, -PexpectedFailures).'
    mainClass = 'io.github.mindbound.cclj.headless.CctSuiteRunner'
    def testRom = file('src/test/resources/test-rom')
    def report = headlessDir.get().file('suite.tsv').asFile
    def expectedProp = providers.gradleProperty('expectedFailures').getOrNull()
    File expected = null
    if (expectedProp == null) {
        def candidate = file("src/test/resources/headless/expected-failures-${factoryKey}${httpEnabled ? '-http' : ''}.txt")
        if (candidate.exists()) expected = candidate
    } else if (expectedProp != 'none') {
        expected = rootProject.file(expectedProp)
        if (!expected.exists()) throw new GradleException("-PexpectedFailures: no such file: ${expected}")
    }
    inputs.dir(testRom)
    if (expected != null) inputs.file(expected)
    argumentProviders.add({
        ['--core-jar', cctCoreJar.singleFile.absolutePath, '--test-rom', testRom.absolutePath,
         '--factory', factoryClass, '--report', report.absolutePath,
         '--timeout', providers.gradleProperty('suiteTimeout').getOrElse('300')] +
            (httpEnabled ? ['--http'] : []) +
            (expected != null ? ['--expected-failures', expected.absolutePath] : [])
    } as CommandLineArgumentProvider)
}

// ---- Native library self-test (M0 gate G0) ----------------------------------------------------------------------
//   ./gradlew :common:nativeProbe    loads natives/<platform-id>/<lib> from the classpath through NativeLoader
//                                    (extracting it to build/nativeProbe/cache, emptied first) and runs the
//                                    self-test in natives/src/cclj.c. Fails unless the report says ok=true, and
//                                    when no library has been built for this platform.
// Build the library first: bash natives/build-natives.sh <platform-id>. Not part of `check`: a build without
// natives is valid (Cobalt fallback).
tasks.register('nativeProbe', JavaExec) {
    group = 'verification'
    description = 'Loads the native library through NativeLoader and runs its self-test (needs ' +
        'natives/build-natives.sh first).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.mindbound.cclj.natives.NativeProbe'
    jvmArgs('-Xcheck:jni')
    def probeDir = layout.buildDirectory.dir('nativeProbe').get()
    def cache = probeDir.dir('cache').asFile
    // A JVM crash log (hs_err_pid*.log) lands under build/ too.
    workingDir = probeDir.dir('work').asFile
    args(cache.absolutePath)
    doFirst {
        cache.deleteDir()
        workingDir.mkdirs()
        def meta = it.javaLauncher.get().metadata
        it.logger.lifecycle("${it.name}: Java ${meta.javaRuntimeVersion} at ${meta.installationPath}")
    }
    jniScan(it)
}

// ---- Tier 1 and Tier 2 of S1 (docs/port-1.21.1/M1.md section 3.15) ----------------------------------------------
//   ./gradlew :common:bridgeProbe     BridgeProbe (Tier 1): the natives Java package against the native library,
//                                     under -Xcheck:jni -Xmx256m, with a fake host. -PcheckJni=false drops
//                                     -Xcheck:jni, only to measure the time per host call (D1).
//   ./gradlew :common:machineSpecs    MachineSpecs (Tier 2): LuaJITMachine against the CC:T machine contract,
//                                     differential against Cobalt; report in build/headless/machineSpecs.tsv.
// Both need the native library: bash natives/build-natives.sh <platform-id>. Both are scanned (jniScan).
tasks.register('bridgeProbe', JavaExec) {
    group = 'verification'
    description = 'Tier 1: runs BridgeProbe against the native library under -Xcheck:jni (-PcheckJni=false: ' +
        'without it, for the time per call).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.mindbound.cclj.natives.BridgeProbe'
    if (providers.gradleProperty('checkJni').getOrElse('true') != 'false') jvmArgs('-Xcheck:jni')
    // Keep -Xmx256m: the JNI-failure check fills the Java heap, and fails on purpose when the maximum heap is over
    // 1 GiB. Keep the class path a plain class path (no pathing jar): the library-failure check starts a second JVM
    // with java.class.path.
    jvmArgs('-Xmx256m')
    def probeDir = layout.buildDirectory.dir('bridgeProbe').get()
    def cache = probeDir.dir('cache').asFile
    workingDir = probeDir.dir('work').asFile
    args(cache.absolutePath)
    doFirst {
        cache.deleteDir()
        workingDir.mkdirs()
        def meta = it.javaLauncher.get().metadata
        it.logger.lifecycle("${it.name}: Java ${meta.javaRuntimeVersion} at ${meta.installationPath}")
    }
    jniScan(it)
}

tasks.register('machineSpecs', JavaExec) {
    configureHeadless(it)
    description = 'Tier 2: runs LuaJITMachine against the CC:T machine contract, differential against Cobalt ' +
        '(report in build/headless/machineSpecs.tsv).'
    mainClass = 'io.github.mindbound.cclj.headless.MachineSpecs'
    // Each scenario has its own 10 s watchdog (120 s for the through-Computer cases); this bounds the whole run.
    timeout = java.time.Duration.ofMinutes(5)
    def report = headlessDir.get().file('machineSpecs.tsv').asFile
    args('--report', report.absolutePath)
}

tasks.register('fairnessProbe', JavaExec) {
    configureHeadless(it)
    description = 'Measures timer lateness while another computer busy-loops, under Cobalt (informational; ' +
        '-Pnopause, -Pthreads=N).'
    mainClass = 'io.github.mindbound.cclj.headless.FairnessProbe'
    def noPause = providers.gradleProperty('nopause').isPresent()
    systemProperty('threads', providers.gradleProperty('threads').getOrElse('1'))
    argumentProviders.add({
        ['--core-jar', cctCoreJar.singleFile.absolutePath] + (noPause ? ['--nopause'] : [])
    } as CommandLineArgumentProvider)
}
